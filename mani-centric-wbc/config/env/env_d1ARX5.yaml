    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    # ARX5 arm
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020
  device: ${..sim_device}

constraints:
  feet_drag:
    # Rigid-body order after collapsing fixed joints in d1_arx5.urdf.
    feet_rigid_body_indices:
      - 5
      - 10
      - 15
      - 20
  torque:
    violation_torque: 5.0
  collision:
    link_names:
      - FL_hip
      - FL_thigh
      - FL_calf
      - FR_hip
      - FR_thigh
      - FR_calf
      - RL_hip
      - RL_thigh
      - RL_calf
      - RR_hip
      - RR_thigh
      - RR_calf
      - link1
      - link2
      - link3
      - link4
      - link5
  joint_limit:

  - obs@state_obs: quadruped_state
  - obs@privileged_state_obs: quadruped_privileged_state
  - obs@privileged_setup_obs: quadruped_privileged_setup
  - _self_

ctrl_delay:
  _convert_: all
  _target_: torch.tensor
  data:
    # D1 wheel-legged base
    - 0.020
    - 0.020
    - 0.020

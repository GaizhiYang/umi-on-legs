      data:
        # Front left
        - -0.7854
        - -1.8326
        - -2.72
        # Front right
        - -0.7854
        - -1.8326
        - -2.72
        # Rear left
        - -0.7854
        - -1.8326
        - -2.72
        # Rear right
        - -0.7854
        - -1.8326
        - -2.72
        # ARX5
        - -3.141592653589793
        - 0.0
        - 0.0
        - -1.57079632679
        - -1.57079632679
        - -1.57079632679
    upper:
      data:
        # Front left
        - 0.7854
        - 3.4034
        - -0.85
        # Front right
        - 0.7854
        - 3.4034
        - -0.85
        # Rear left
        - 0.7854

cfg:
  env:
    num_observations: ???
    num_actions: 16

  init_state:
    pos:
      - 0.0
      - 0.0
      - 0.48

  asset:
    file: "{LEGGED_GYM_ROOT_DIR}/resources/robots/d1_description/urdf/robot.urdf"
    name: "d1"
    terminate_after_contacts_on:
      - base_link
      - face_link
      - locking_link
      - hip
    self_collisions: 0
    collapse_fixed_joints: true
    flip_visual_attachments: true
    force_sensor_links:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot

  domain_rand:
    randomize_rigid_body_masses:
      - base_link
    added_mass_range:
      - -2.0
      - 2.0
    randomize_rigid_body_com:
      - base_link
